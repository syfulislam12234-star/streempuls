version: '3.8'

# ============================================================================
# StreamPulse 24/7 YouTube Live Streaming SaaS - Multi-Container Stack
# Production Deployment for High Availability, Zero Downtime & Fault Isolation
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. REDIS CACHE & BULLMQ MESSAGE BROKER (Alpine)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: streampulse-redis
    restart: always
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 1024mb 
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - streampulse-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  # --------------------------------------------------------------------------
  # 2. EXPRESS API GATEWAY (HTTP REST API)
  # --------------------------------------------------------------------------
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: streampulse-api
    restart: on-failure
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATA_DIR=/app/data
      - QUEUE_NAME=streaming-queue
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Modular Storage Provider: Supabase active by default, switchable to R2
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-supabase}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-stream-assets}
      # Switchable Cloudflare R2 Credentials
      - CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_R2_ACCOUNT_ID:-}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT:-}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME:-stream-assets}
      - CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET:-stream-assets}
      - CLOUDFLARE_R2_PUBLIC_DOMAIN=${CLOUDFLARE_R2_PUBLIC_DOMAIN:-}
      - R2_CORS_ALLOWED_ORIGINS=${R2_CORS_ALLOWED_ORIGINS:-https://streempuls.mooo.com,https://www.streempuls.mooo.com,http://localhost:5173,http://127.0.0.1:5173}
    expose:
      - "4000"
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/health > /dev/null || curl -fs http://127.0.0.1:4000/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - streampulse-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # 3. ISOLATED STREAMING WORKER NODES (stream-worker-node)
  # Fault-Tolerant Horizontal Scaling:
  # docker compose up -d --scale stream-worker-node=N
  # Each isolated container enforces MAX 10 active live streams (MAX_CONCURRENT_STREAMS=10).
  # If one worker node crashes under heavy load, it automatically restarts via restart policies
  # without crashing the main API or sibling worker containers.
  # --------------------------------------------------------------------------
  stream-worker-node:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "healthcheck-worker.js"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - NODE_ENV=production
      - QUEUE_NAME=streaming-queue
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Hard Capacity Constraint per worker container
      - MAX_CONCURRENT_STREAMS=10
      - MAX_RESTART_RETRIES=5
      - WORKER_CONCURRENCY=10
      - MEMORY_CEILING_MB=1850
      # Modular Storage Provider: Supabase active by default, switchable to R2
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-supabase}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-stream-assets}
      # Switchable Cloudflare R2 Credentials
      - CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_R2_ACCOUNT_ID:-}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT:-}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME:-stream-assets}
      - CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET:-stream-assets}
      - CLOUDFLARE_R2_PUBLIC_DOMAIN=${CLOUDFLARE_R2_PUBLIC_DOMAIN:-}
    depends_on:
      redis:
        condition: service_healthy
      backend-api:
        condition: service_started
    networks:
      - streampulse-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  redis-data:
    driver: local
  app-data:
    driver: local

networks:
  streampulse-net:
    driver: bridge
