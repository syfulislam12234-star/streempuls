# ==============================================================================
# StreamPulse Unified VPS Nginx Reverse Proxy Configuration
# Supports single-VPS deployment with separate subdomains:
#   - Main Streaming Studio: https://streampulse.io (and www.streampulse.io)
#   - Secure Admin Dashboard: https://admin.streampulse.io (or streampulse.io/admin)
# ==============================================================================

# Rate limiting zones to protect backend against brute force and DDoS
limit_req_zone $binary_remote_addr zone=streampulse_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=streampulse_admin:10m rate=10r/s;

# Upstream Node.js / Vite / Express server running on port 3000
upstream streampulse_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. HTTP to HTTPS Global Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name streampulse.io www.streampulse.io admin.streampulse.io;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Main User Streaming Studio: https://streampulse.io
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name streampulse.io www.streampulse.io;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/streampulse.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streampulse.io/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max upload body size for high-bitrate video clips & payment screenshot uploads
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    # Strict Admin Rate Limiting & Admin API Route
    location /api/admin/ {
        limit_req zone=streampulse_admin burst=15 nodelay;
        proxy_pass http://streampulse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Subdomain "true";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Routes Rate Limiting
    location /api/ {
        limit_req zone=streampulse_api burst=50 nodelay;
        proxy_pass http://streampulse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Portal Direct Route (streampulse.io/admin)
    location /admin {
        limit_req zone=streampulse_admin burst=20 nodelay;
        proxy_pass http://streampulse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Subdomain "true";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root and SPA fallback
    location / {
        proxy_pass http://streampulse_upstream;
        proxy_http_version 1.1;

        # WebSocket & RTMP Live Preview Stream proxy support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for continuous streaming connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# ------------------------------------------------------------------------------
# 3. Secure Admin Dashboard: https://admin.streampulse.io
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.streampulse.io;

    # SSL Certificates (Wildcard or dedicated cert)
    ssl_certificate /etc/letsencrypt/live/admin.streampulse.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.streampulse.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers for Admin Portal
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 50M;

    # Strict Admin Rate Limiting (Protects secret gate against brute force)
    location /api/admin/ {
        limit_req zone=streampulse_admin burst=15 nodelay;
        proxy_pass http://streampulse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Admin-Subdomain "true";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Portal Frontend Route
    location / {
        proxy_pass http://streampulse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Admin-Subdomain "true";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
